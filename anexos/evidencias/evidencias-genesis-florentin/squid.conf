# Laboratorio Squid y TLS
# Configuracion del servidor proxy

http_port 127.0.0.1:3128
visible_hostname ubuntu-proxy

# Listas de control de acceso
acl clientes_lab src 127.0.0.1/32
acl SSL_ports port 443
acl CONNECT method CONNECT

acl permitido dstdomain permitido.test
acl restringido dstdomain restringido.test

# Politicas de acceso
http_access deny !clientes_lab
http_access deny !CONNECT
http_access deny !SSL_ports
http_access deny restringido
http_access allow clientes_lab permitido
http_access deny all

# Registro de solicitudes
access_log /var/log/squid/access.log squid

# Desactivar almacenamiento en cache
cache deny all
